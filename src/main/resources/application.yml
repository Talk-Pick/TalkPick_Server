jwt:
  secret: ${JWT_SECRET}
  accessTokenExpireTime: ${JWT_ACCESS_EXPIRE_TIME}
  refreshTokenExpireTime: ${JWT_REFRESH_EXPIRE_TIME}

server:
  port: ${SERVER_PORT}
  tomcat:
    threads:
      max: ${THREADS_MAX}
    accept-count: ${ACCEPT_COUNT}

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: ${CONNECTION_TIMEOUT}
      maximum-pool-size: ${MAXIMUM_POOL_SIZE}
      idle-timeout: ${IDLE_TIMEOUT}
      max-lifetime: ${MAX_LIFETIME}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: ${DDL_AUTO}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE}
      max-request-size: ${MAX_REQUEST_SIZE}
  messages:
    basename: messages,errors
  web:
    resources:
      add-mappings: false

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.web.cors: debug

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health, prometheus

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  response-type: ${KAKAO_RESPONSE_TYPE}

apple:
  bundle-id: ${APPLE_BUNDLE_ID}

google:
  client-id: ${GOOGLE_CLIENT_ID}

resilience4j:
  circuitbreaker:
    instances:
      llm:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

healthcheck:
  url: ${HEALTH_CHECK_URL}

jasypt:
  admin:
    secret-key: ${JASYPT_ADMIN_SECRET_KEY}
  member:
    secret-key: ${JASYPT_MEMBER_SECRET_KEY}
  algorithm: ${JASYPT_ALGORITHM:PBEWITHHMACSHA512ANDAES_256}
  pool-size: ${JASYPT_POOL_SIZE:1}

springdoc:
  swagger-ui:
    path: ${SWAGGER_UI_PATH}
  api-docs:
    path: ${DOCS_PATH}

app:
  security:
    swagger-password: ${SPRING_DOC_PASSWORD}
    blocked-user-agents: ${BLOCKED_AGENTS}
    blocked-paths: ${BLOCKED_PATHS}