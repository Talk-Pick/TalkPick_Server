---
version: 0.0
os: linux

files:
  - source: /
    destination: /home/ec2-user/TalkPick_Server
    overwrite: yes

permissions:
  - object: /home/ec2-user/TalkPick_Server
    pattern: "**"
    owner: ec2-user
    group: ec2-user
    mode: "755"

hooks:
  ApplicationStop:
    - location: scripts/stop-server.sh
      timeout: 60
      runas: ec2-user

  ApplicationStart:
    - location: scripts/start-server.sh
      timeout: 60
      runas: ec2-user